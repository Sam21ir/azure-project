---
- name: Mise à jour du système
  dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Installation des paquets de base
  dnf:
    name:
      - curl
      - wget
      - vim
      - git
      - net-tools
      - bash-completion
      - iproute-tc
    state: present

- name: Désactivation de firewalld
  systemd:
    name: firewalld
    state: stopped
    enabled: false
  ignore_errors: true

- name: Désactivation du swap (runtime)
  command: swapoff -a
  changed_when: false

- name: Désactivation du swap (permanent)
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Chargement des modules kernel nécessaires
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persistance des modules kernel au démarrage
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Configuration des paramètres sysctl pour Kubernetes
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/k8s.conf
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables",  value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward",                 value: "1" }

- name: Désactivation de SELinux (permissive)
  selinux:
    policy: targeted
    state: permissive
